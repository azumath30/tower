<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイルマップ</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1b24;
    color: #ddd;
    font-family: "Segoe UI", "Meiryo", sans-serif;
  }
  /* 横に3列：左＝説明と接続ボタン（下に寄せる）／中＝ゲーム画面（上下いっぱい）／右＝数字 */
  body {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    gap: 8px;
    padding: 4px;
    box-sizing: border-box;
    overflow: hidden;
  }
  #left, #right {
    flex: 1 1 0;                     /* 画面のあまりを左右で分けあう */
    min-width: 200px;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #left { justify-content: flex-end; }          /* 左下に寄せる */
  #right { justify-content: space-between; }    /* 数字は上、十字キーは下 */
  canvas {
    align-self: center;
    image-rendering: pixelated;      /* ドット絵をぼかさず拡大 */
    border: 2px solid #3a3a4a;
    border-radius: 4px;
    background: #000;
    touch-action: none;
  }
  #help { font-size: 13px; color: #999; line-height: 1.5; }
  #hud {
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: #ffd84a;
    font-weight: bold;
  }
  #hud .stat { background: #26263a; border-radius: 8px; padding: 8px 12px; }
  #hud .lbl { font-size: 14px; color: #aaa; }
  #hud .val { font-size: 32px; line-height: 1.1; text-align: right; }
  #hud.up .exp { animation: expUp 0.4s; }
  @keyframes expUp { 0% { transform: scale(1.3); color: #fff; } 100% { transform: scale(1); } }
  #joy {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    font-size: 14px;
  }
  #joy label { display: flex; flex-direction: column; gap: 4px; }
  .serialBtn {
    padding: 8px 10px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: #2f7d4f;
    color: #fff;
    cursor: pointer;
  }
  .serialBtn:hover { background: #3a9862; }
  .serialBtn.connected { background: #8a3a3a; }
  .serialStatus { color: #999; font-size: 12px; text-align: center; margin-bottom: 4px; }
  #floorSel { font-size: 14px; padding: 3px; }

  /* スマホ・タブレット用の十字キー */
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
    user-select: none;
  }
  #pad button {
    font-size: 22px;
    border: none;
    border-radius: 10px;
    background: #3a3a4a;
    color: #fff;
    touch-action: none;
  }
  #pad button:active { background: #5a5a70; }
  #pad .up { grid-column: 2; grid-row: 1; }
  #pad .left { grid-column: 1; grid-row: 2; }
  #pad .down { grid-column: 2; grid-row: 2; }
  #pad .right { grid-column: 3; grid-row: 2; }
  #pad .fire { grid-column: 3; grid-row: 1; background: #a8442e; }
  @media (hover: hover) and (pointer: fine) { #pad { display: none; } }

  #hud .val.small { font-size: 28px; }
  /* かい の らん：たして この数に する、を目立たせる */
  #hud .floorStat { background: #3a2414; border: 3px solid #ff8a3a; }
  #hud .floorStat .lbl { color: #ffc48a; }
  #hud .floorStat .val { font-size: 48px; color: #ff9a4a; text-align: center; }
  #hud .floorStat .sub { color: #ffc48a; font-size: 14px; }
  #hud .sub { font-size: 13px; color: #aaa; text-align: right; }
  /* レベル：次のレベルまでのバー */
  .lvbar { height: 8px; background: #1b1b2a; border-radius: 4px; margin-top: 4px; overflow: hidden; }
  #lvFill { height: 100%; width: 0; background: #7cf08a; border-radius: 4px; transition: width 0.3s; }
  #levelStat.up { animation: lvUp 0.8s; }
  @keyframes lvUp { 0% { transform: scale(1.15); background: #4a7a3a; } 100% { transform: scale(1); } }
  .zukanBtn { background: #6a4bb0; font-size: 16px; padding: 10px; }
  .zukanBtn:hover { background: #7d5dc8; }
  .resetBtn { background: #44444f; font-size: 12px; padding: 5px; }
  .resetBtn:hover { background: #5a5a68; }

  /* ━━━ 組み合わせずかん（画面全体にかぶせる） ━━━ */
  #zukan {
    position: fixed; inset: 0;
    background: rgba(10, 10, 20, 0.88);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  #zukan.open { display: flex; }
  #zukanPanel {
    background: #22223a; border: 3px solid #6a4bb0; border-radius: 14px;
    width: min(1100px, 94vw); max-height: 92vh;
    display: flex; flex-direction: column;
    padding: 16px 20px; box-sizing: border-box;
  }
  #zukanHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #zukanHead h2 { margin: 0; color: #ffd84a; font-size: 28px; }
  #zukanTotal { color: #fff; font-size: 20px; font-weight: bold; }
  #zukanClose { font-size: 16px; }
  #zukanNote { color: #aaa; font-size: 13px; margin-bottom: 8px; }
  #zukanList { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 6px; }
  .zrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #2b2b46; border-radius: 8px; padding: 6px 10px; }
  .zrow .door { width: 92px; flex-shrink: 0; color: #fff; font-weight: bold; font-size: 18px; }
  .zrow .door small { color: #aaa; font-size: 12px; font-weight: normal; margin-left: 4px; }
  .zcard {
    min-width: 64px; padding: 6px 10px; border-radius: 8px; text-align: center;
    font-size: 20px; font-weight: bold; font-family: "Consolas", "Meiryo", monospace;
    background: #1b1b2a; color: #555; border: 2px dashed #444;
  }
  .zcard.got { background: #ffd84a; color: #2b1d2a; border: 2px solid #fff3b0; }
  .zcard.complete { background: #7cf08a; border-color: #d8ffe0; }
  .zothers { color: #9ff0ff; font-size: 14px; margin-left: 6px; }

  /* ━━━ この階で あつめる カード（右のらん） ━━━ */
  #cardSlots { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
  .slot {
    font-size: 48px; font-weight: bold; line-height: 1.15;   /* 48px ＝ 約36pt */
    text-align: center; border-radius: 10px; padding: 2px 4px;
    font-family: "Consolas", "Meiryo", monospace;
    background: #1b1b2a; color: #777; border: 2px dashed #555;
  }
  .slot.got { background: #ffd84a; color: #2b1d2a; border: 2px solid #fff3b0; }
  .slot.building { color: #9ff0ff; border-color: #9ff0ff; }
  .slot.boss { font-size: 24px; color: #d8b0ff; border-color: #8a48d8; }
  .slot.boss.got { background: #8a48d8; color: #fff; border: 2px solid #d8b0ff; }
  .slot.pop { animation: slotPop 0.5s; }
  @keyframes slotPop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<!-- 左：説明と接続ボタン（左下に縦に並べる） -->
<div id="left">
  <div id="help">矢印キー / WASD / ジョイスティック で移動<br>スペースキー / ボタンR0 で玉<br>（敵の数だけ続けて当てる）</div>
  <div id="joy">
    <button id="zukanBtn" class="serialBtn zukanBtn">📖 ずかん（Z / R9）</button>
    <label>スタートの階 <select id="floorSel"></select></label>
    <button id="joyBtn" class="serialBtn">ジョイスティック 接続</button>
    <span id="joyStatus" class="serialStatus">未接続</span>
    <button id="btnBtn" class="serialBtn">ボタン 接続</button>
    <span id="btnStatus" class="serialStatus">未接続</span>
    <button id="bgmBtn" class="serialBtn">♪ BGM オン</button>
    <button id="resetBtn" class="serialBtn resetBtn">きろくを けす</button>
  </div>
</div>

<!-- 中：ゲーム画面 -->
<canvas id="game" width="320" height="224"></canvas>

<!-- 右：数字（階・EXP）と、タッチ端末用の十字キー -->
<div id="right">
<div id="hud">
  <div class="stat floorStat"><div class="lbl">かい</div><div class="val"><span id="floorNo">1</span></div><div class="sub">たして この数に!</div></div>
  <div class="stat"><div class="lbl">カード（とびら <span id="cardTarget">1</span>）</div><div id="cardSlots"></div></div>
  <div class="stat"><div class="lbl">EXP</div><div class="val exp"><span id="exp">0</span></div></div>
  <div class="stat" id="levelStat"><div class="lbl">レベル</div><div class="val"><span id="levelNo">1</span></div>
    <div class="lvbar"><div id="lvFill"></div></div><div class="sub">つぎまで <span id="lvNext">20</span> EXP</div></div>
  <div class="stat"><div class="lbl">ずかん</div><div class="val small"><span id="zukanCount">0</span></div><div class="sub">/ <span id="zukanMax">0</span> まい</div></div>
</div>
<div id="pad">
  <button class="up" data-dir="up">▲</button>
  <button class="left" data-dir="left">◀</button>
  <button class="down" data-dir="down">▼</button>
  <button class="right" data-dir="right">▶</button>
  <button class="fire" id="fireBtn">●</button>
</div>
</div>

<!-- 組み合わせずかん -->
<div id="zukan">
  <div id="zukanPanel">
    <div id="zukanHead">
      <h2>📖 くみあわせ ずかん</h2>
      <div id="zukanTotal"></div>
      <button id="zukanClose" class="serialBtn">とじる（Z）</button>
    </div>
    <div id="zukanNote">あつめた カードが のこるよ。「？」は まだ見つけていない カード。（2+1 と 1+2 は べつの カード）</div>
    <div id="zukanList"></div>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━ 設定 ━━━━━━━━━━━━━━━━
const TILE = 16;                 // タイル1枚の大きさ(px)
const SHEET_COLS = 12;           // tiles.png の横のタイル数
let VIEW_W = 20;                 // 画面に映す横のタイル数（画面の形に合わせて 20〜24 に変わる）
const VIEW_H = 14;               // 画面に映すたてのタイル数
const VIEW_W_MIN = 20, VIEW_W_MAX = 24;   // 24 ＝ いちばん小さいマップ（1かい）の横はば
const SIDE_MIN = 200;            // 左右の列の いちばん せまい はば(px)
const WALK_SPEED = 3.5;          // 1秒に進むタイル数（もとは 5）

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
// ゲームの中の座標は 320×224 のまま。実際のキャンバスは画面の解像度で作り、
// 絵はドットのまま拡大・文字はくっきり描く（resize() で倍率を設定）
let SCREEN_W = VIEW_W * TILE;    // resize() で 320〜384 に変わる
const SCREEN_H = VIEW_H * TILE;

// ━━━━━━━━━━━━━━━━ タイル番号（tiles.png の左上から 0,1,2…） ━━━━━━━━━━━━━━━━
// 3×3 で組むタイル: [左上, 上, 右上, 左, 中, 右, 左下, 下, 右下]
const SET_FOREST = [6, 7, 8, 18, 19, 20, 30, 31, 32];        // 緑の森
const SET_ORANGE = [9, 10, 11, 21, 22, 23, 33, 34, 35];      // 紅葉の森
const SET_DIRT   = [12, 13, 14, 24, 25, 26, 36, 37, 38];     // 土の広場
const T = {
  grass: 0, grassTuft: 1, flowers: 2, stone: 43,
  treeG: 16, treeGs: 28, treeO: 15, treeOs: 27, bush: 5,
  sprout: 17, mushroom: 29, sign: 83, well: 104, hive: 94,
  log: 106, pot: 107, bucket: 130, target: 95, door: 103, key: 117,
};

// ━━━━━━━━━━━━━━━━ マップ作成（階ごとに自動で作る） ━━━━━━━━━━━━━━━━
// 階が上がるたびにマップが広くなり、建物・林・道の配置も変わる。
// 同じ階は毎回同じマップになる（階の番号を乱数の種にしている）。
// ground: 地面（歩ける） / obj: 地面の上に置く物（null 以外は通れない）
let MAP_W = 24, MAP_H = 18;      // マップ全体のタイル数（階ごとに変わる）
let ground = [];
let obj = [];
let reachable = [];              // スタートから歩いて行けるマスの一覧 [x, y]
let START_X = 12, START_Y = 9;   // スタート地点（広場のまん中）

const MAP_SIZE_FIRST = [24, 18]; // 1階の広さ（画面は 20×14 マス）
const MAP_SIZE_GROW = [4, 3];    // 1階上がるごとに広がるマス数
const MAP_SIZE_MAX = [60, 45];   // いちばん広いとき

let seed = 12345;
function rand() {
  seed = (seed * 1103515245 + 12345) & 0x7fffffff;
  return seed / 0x7fffffff;
}
const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
const randPick = arr => arr[Math.floor(rand() * arr.length)];

// 四角い範囲の形を、3×3 のタイルセットで縁取りしながら並べる
function autotile(layer, cells, set) {
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (!cells(x, y)) continue;
      const n = cells(x, y - 1), s = cells(x, y + 1), w = cells(x - 1, y), e = cells(x + 1, y);
      const row = !n ? 0 : !s ? 2 : 1;
      const col = !w ? 0 : !e ? 2 : 1;
      layer[y][x] = set[row * 3 + col];
    }
  }
}
const inRect = (x0, y0, x1, y1) => (x, y) => x >= x0 && x <= x1 && y >= y0 && y <= y1;

// 建物の形（null は何も置かない）。door: ドアの位置（道をつなぐ）
const BUILDINGS = [
  { name: '城', rows: [[99, 100, 100, 101], [111, 112, 113, 114], [123, 124, 125, 126]], door: [2, 2] },
  { name: '灰色の家', rows: [[48, 49, 50], [60, 61, 62], [72, 85, 75]], door: [1, 2] },
  { name: '石の家', rows: [[52, 53, 53, 54], [64, 65, 65, 66], [76, 77, 89, 79]], door: [2, 2] },
  { name: '木の家', rows: [[52, 53, 54], [64, 65, 66], [84, 86, 87]], door: [1, 2] },
  { name: '畑', rows: [[44, 45, 45, 45, 46], [56, 17, 17, 17, 58], [56, 17, 17, 17, 58], [68, 69, 69, 69, 70]], door: null },   // キノコ(29)は今は置かない → 芽(17)に
];
const PROPS = [T.treeG, T.treeGs, T.treeO, T.treeOs, T.bush, T.bush,   // キノコ(T.mushroom)は今は置かない（あとでアイテムの材料にする）
  T.pot, T.log, T.bucket, T.hive, T.target, T.sign];   // オレンジの花(T.flowers)は今は置かない（あとでアイテムの材料にする）

function generateMap(f) {
  seed = 12345 + f * 7919;
  MAP_W = Math.min(MAP_SIZE_MAX[0], MAP_SIZE_FIRST[0] + (f - 1) * MAP_SIZE_GROW[0]);
  MAP_H = Math.min(MAP_SIZE_MAX[1], MAP_SIZE_FIRST[1] + (f - 1) * MAP_SIZE_GROW[1]);
  ground = [];
  obj = [];
  const used = [];               // 建物・林・広場・道を置いたマス（ほかの物を重ねない）
  for (let y = 0; y < MAP_H; y++) {
    ground.push([]); obj.push([]); used.push([]);
    for (let x = 0; x < MAP_W; x++) {
      const r = rand();
      ground[y].push(r < 0.8 ? T.grass : T.grassTuft);   // オレンジの花は今は置かない
      obj[y].push(null);
      used[y].push(false);
    }
  }
  const free = (x0, y0, x1, y1) => {   // 範囲（まわり1マスも含む）があいているか
    for (let y = y0 - 1; y <= y1 + 1; y++) for (let x = x0 - 1; x <= x1 + 1; x++) {
      if (x < 2 || y < 2 || x >= MAP_W - 2 || y >= MAP_H - 2 || used[y][x]) return false;
    }
    return true;
  };
  const mark = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) used[y][x] = true; };

  // 外周の森（偶数階は紅葉の森。マップの外も森として扱い、外側に縁ができないようにする）
  const border = f % 2 === 0 ? SET_ORANGE : SET_FOREST;
  autotile(obj, (x, y) => x < 2 || y < 2 || x >= MAP_W - 2 || y >= MAP_H - 2, border);

  // まん中の土の広場（スタート地点）と井戸
  START_X = Math.floor(MAP_W / 2);
  START_Y = Math.floor(MAP_H / 2);
  const px0 = START_X - 3, py0 = START_Y - 2, px1 = START_X + 2, py1 = START_Y + 2;
  autotile(ground, inRect(px0, py0, px1, py1), SET_DIRT);
  obj[START_Y][START_X - 1] = T.well;
  mark(px0, py0, px1, py1);

  // 道：(x, y) から広場へ、たて → よこ の順に石畳をしく
  const roadTo = (x, y) => {
    const ty = Math.max(py0, Math.min(py1, y));
    for (let yy = Math.min(y, ty); yy <= Math.max(y, ty); yy++) if (ground[yy][x] !== undefined && !obj[yy][x]) { ground[yy][x] = T.stone; used[yy][x] = true; }
    const tx = Math.max(px0, Math.min(px1, x));
    for (let xx = Math.min(x, tx); xx <= Math.max(x, tx); xx++) if (!obj[ty][xx] && !(xx >= px0 && xx <= px1 && ty >= py0 && ty <= py1)) { ground[ty][xx] = T.stone; used[ty][xx] = true; }
  };

  // 建物（広いマップほどたくさん）
  const area = MAP_W * MAP_H;
  const nBuild = 2 + Math.floor(area / 220);
  for (let i = 0, tries = 0; i < nBuild && tries < 300; tries++) {
    const b = i === 0 ? BUILDINGS[0] : randPick(BUILDINGS.slice(1));   // 1つ目は必ず城
    const bw = b.rows[0].length, bh = b.rows.length;
    const x0 = randInt(2, MAP_W - 3 - bw), y0 = randInt(2, MAP_H - 4 - bh);
    if (!free(x0, y0, x0 + bw - 1, y0 + bh)) continue;   // ドアの前の1マスもあける
    b.rows.forEach((row, dy) => row.forEach((t, dx) => { if (t !== null) obj[y0 + dy][x0 + dx] = t; }));
    mark(x0, y0, x0 + bw - 1, y0 + bh - 1);
    if (b.door) roadTo(x0 + b.door[0], y0 + b.door[1] + 1);
    i++;
  }

  // 林のかたまり（緑と紅葉がまざる）
  const nClump = 2 + Math.floor(area / 120);
  for (let i = 0, tries = 0; i < nClump && tries < 400; tries++) {
    const w = randInt(3, 5), h = randInt(3, 4);
    const x0 = randInt(2, MAP_W - 2 - w), y0 = randInt(2, MAP_H - 2 - h);
    if (!free(x0, y0, x0 + w - 1, y0 + h - 1)) continue;
    autotile(obj, inRect(x0, y0, x0 + w - 1, y0 + h - 1), rand() < 0.6 ? SET_FOREST : SET_ORANGE);
    mark(x0, y0, x0 + w - 1, y0 + h - 1);
    i++;
  }

  // 木や小物をちらばらせる（道や広場の上には置かない）
  const nProp = Math.floor(area / 22);
  for (let i = 0; i < nProp; i++) {
    const x = randInt(2, MAP_W - 3), y = randInt(2, MAP_H - 3);
    if (used[y][x] || obj[y][x] !== null) continue;
    obj[y][x] = randPick(PROPS);
  }

  // スタートから歩いて行けるマスを調べる（行けない場所に敵や扉を置かないため）
  reachable = floodFrom(START_X, START_Y, null);
}

// (sx, sy) から歩いて行けるマスの一覧。block のマスは通れないものとして調べる
function floodFrom(sx, sy, block) {
  const seen = new Set([sy * MAP_W + sx]);
  const list = [[sx, sy]];
  for (let i = 0; i < list.length; i++) {
    const [x, y] = list[i];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, k = ny * MAP_W + nx;
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H || seen.has(k) || obj[ny][nx] !== null) continue;
      if (block && block[0] === nx && block[1] === ny) continue;
      seen.add(k);
      list.push([nx, ny]);
    }
  }
  return list;
}

// 扉の場所：スタートから遠く、そこをふさいでもほかの場所へ行けるマス
function chooseDoor() {
  const far = reachable
    .filter(([x, y]) => Math.abs(x - START_X) + Math.abs(y - START_Y) >= 8)
    .sort((a, b) => (Math.abs(b[0] - START_X) + Math.abs(b[1] - START_Y)) -
                    (Math.abs(a[0] - START_X) + Math.abs(a[1] - START_Y)));
  // いちばん遠い所ばかりにならないよう、遠い方の半分からランダムに選ぶ
  const cands = far.slice(0, Math.max(1, Math.floor(far.length / 2)));
  for (let i = 0; i < 40 && cands.length; i++) {
    const [x, y] = cands.splice(Math.floor(rand() * cands.length), 1)[0];
    if (floodFrom(START_X, START_Y, [x, y]).length === reachable.length - 1) return { x, y };
  }
  return far.length ? { x: far[0][0], y: far[0][1] } : null;
}

// カギができるまで、扉のマスは通れない
const isWalkable = (x, y) =>
  x >= 0 && y >= 0 && x < MAP_W && y < MAP_H && obj[y][x] === null && !(isDoor(x, y) && !keyDone);

// ━━━━━━━━━━━━━━━━ 主人公のドット絵（16×16） ━━━━━━━━━━━━━━━━
const PALETTE = {
  k: '#2b1d2a', h: '#8a4b2a', s: '#f2c29b', e: '#2b1d2a',
  b: '#3f6fd8', B: '#2c4fa3', w: '#e0b040', l: '#5a3a28',
};
// 頭（8行）を向きごとに組み立てる。'..k' + 中身10文字 + 'k..' で幅16
function headRows(kind) {
  const L = '..k', R = 'k..';
  const top = ['................', '....kkkkkkkk....', '...khhhhhhhhk...', L + 'hhhhhhhhhh' + R];
  if (kind === 'down') return top.concat([
    L + 'hsssssssss'.slice(0, 9) + 'h' + R,
    L + 'ssessssess' + R,
    L + 'ssssssssss' + R,
    '...kkssssssk' + 'k...',
  ]);
  if (kind === 'up') return top.concat([
    L + 'hhhhhhhhhh' + R,
    L + 'hhhhhhhhhh' + R,
    L + 'hhhhhhhhhh' + R,
    '...kkhhhhhhk' + 'k...',
  ]);
  // 右向き
  return top.concat([
    L + 'hhhhhhssss' + R,
    L + 'hhhhhsssse' + R,
    L + 'hhhhhsssss' + R,
    '...kkhhsssss' + 'k...',
  ]);
}
const BODY = [
  '..kbbbbbbbbbbk..',
  '.ksbbbbbbbbbbsk.',
  '.ksbbbbbbbbbbsk.',
  '..kwwwwwwwwwwk..',
];
const LEGS = [
  ['...kllk..kllk...', '...kllk..kllk...', '...kkkk..kkkk...'],  // 立ち
  ['...kllk..kllk...', '...kkkk..kllk...', '.........kkkk...'],  // 歩き1
  ['...kllk..kllk...', '...kllk..kkkk...', '...kkkk.........'],  // 歩き2
];
function makeSprite(kind, legFrame) {
  const rows = headRows(kind).concat(BODY, [LEGS[legFrame][0].replace(/l/g, 'B')], LEGS[legFrame]);
  const c = document.createElement('canvas');
  c.width = c.height = TILE;
  const g = c.getContext('2d');
  rows.slice(0, 16).forEach((row, y) => {
    for (let x = 0; x < 16; x++) {
      const col = PALETTE[row[x]];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  });
  return c;
}
function mirror(src) {
  const c = document.createElement('canvas');
  c.width = c.height = TILE;
  const g = c.getContext('2d');
  g.translate(TILE, 0);
  g.scale(-1, 1);
  g.drawImage(src, 0, 0);
  return c;
}
// SPRITES[向き][コマ]  コマ0=立ち, 1・2=歩き
const SPRITES = {};
for (const kind of ['down', 'up', 'right']) {
  SPRITES[kind] = [0, 1, 2].map(f => makeSprite(kind, f));
}
SPRITES.left = SPRITES.right.map(mirror);
// やられたときに点滅させる、真っ白な主人公

  const c = document.createElement('canvas');
  c.width = c.height = TILE;
  const g = c.getContext('2d');
  g.drawImage(SPRITES.down[0], 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, TILE, TILE);
  return c;
})();

// ━━━━━━━━━━━━━━━━ 主人公 ━━━━━━━━━━━━━━━━
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const hero = {

// 押されている方向（後から押したものを優先）
const held = [];

function release(d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); }

  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',

// ━━━━━━━━━━━━━━━━ Arduino 2台（Web Serial・どちらも 9600bps） ━━━━━━━━━━━━━━━━
// ① ジョイスティック（20261107joystick.ino）が送る文字:
//   UP / RIGHT / DOWN / LEFT（倒した）  UP_OFF など（戻した）
//   READY（起動した）  STATE:上右下左（"?" を送ったときの今の状態。例 STATE:1100）
// ② 10個ボタンが送る文字: R0〜R9（押した）。今は R0 で玉を発射
//
// どちらのポートから来た文字も同じように読むので、
// 「ジョイスティック接続」でボタンの方を選んでしまっても、そのまま動く。
const JOY_NAMES = { UP: 'up', RIGHT: 'right', DOWN: 'down', LEFT: 'left' };
const JOY_ORDER = ['up', 'right', 'down', 'left'];   // STATE の並び順
const BUTTON_ACTIONS = {
  R0: () => fire(),
  R9: () => toggleZukan(),        // ずかんを開く・とじる
  // R1〜R8 はあとで使う（例: R1: () => useItem()）
};

async function sendText(dev, text) {
  try {
    const writer = dev.port.writable.getWriter();
    await writer.write(new TextEncoder().encode(text));
    writer.releaseLock();
  } catch (e) { /* 送れなくても操作はできるので無視 */ }
}

// 1行ぶんの文字を処理する。dev = どのArduinoから来たか
function handleSerialLine(dev, line) {
  if (BUTTON_ACTIONS[line]) {
    dev.kind = 'ボタン';
    BUTTON_ACTIONS[line]();
  } else if (/^R\d$/.test(line)) {
    dev.kind = 'ボタン';                 // R1〜R9 は今は何もしない
  } else if (line === 'READY') {
    // ジョイスティックは接続時に再起動するので、起動したら今の状態を聞き直す
    sendText(dev, '?');
  } else if (line.startsWith('STATE:')) {
    dev.kind = 'ジョイスティック';
    const bits = line.slice(6);
    JOY_ORDER.forEach((d, i) => (bits[i] === '1' ? press(d) : release(d)));
  } else if (line.endsWith('_OFF') && JOY_NAMES[line.slice(0, -4)]) {
    dev.kind = 'ジョイスティック';
    release(JOY_NAMES[line.slice(0, -4)]);
  } else if (JOY_NAMES[line]) {
    dev.kind = 'ジョイスティック';
    press(JOY_NAMES[line]);
  } else {
    return;
  }
  dev.showStatus();
}

// 接続ボタン1つぶんを用意する
function makeSerialDevice(btnId, statusId, label) {
  const btn = document.getElementById(btnId);
  const status = document.getElementById(statusId);
  const dev = { port: null, reader: null, kind: null };

  dev.setStatus = (text, connected) => {
    status.textContent = text;
    btn.textContent = label + (connected ? ' 切断' : ' 接続');
    btn.classList.toggle('connected', connected);
  };
  // 実際に届いた文字で、つながっているのが何かを表示する
  dev.showStatus = () => dev.setStatus(dev.kind ? '接続中（' + dev.kind + '）' : '接続中', true);

  dev.connect = async () => {
    let port;
    try {
      port = await navigator.serial.requestPort();
      if (devices.some(o => o !== dev && o.port === port)) {
        dev.setStatus('そのポートはもう一方でつないでいます。別のポートを選んでください', false);
        return;
      }
      await port.open({ baudRate: 9600 });
    } catch (e) {
      if (e.name === 'NotFoundError') {
        // ポート選択の画面で何も選ばずに閉じた（一覧が空だった場合も含む）
        dev.setStatus('ポートが選ばれませんでした。一覧に出ない場合はUSBの接続を確認してください', false);
      } else if (e.name === 'InvalidStateError' || e.name === 'NetworkError') {
        dev.setStatus('ポートを開けませんでした。ほかのソフト（シリアルモニタ等）が使っていないか確認してください', false);
      } else {
        dev.setStatus('接続できませんでした（' + e.message + '）', false);
      }
      return;
    }
    dev.port = port;
    dev.kind = null;
    dev.showStatus();
    if (label === 'ジョイスティック') sendText(dev, '?');   // 今の倒し具合を聞く

    const decoder = new TextDecoderStream();
    const closed = port.readable.pipeTo(decoder.writable).catch(() => {});
    dev.reader = decoder.readable.getReader();
    let buf = '';
    try {
      while (true) {
        const { value, done } = await dev.reader.read();
        if (done) break;
        buf += value;
        const lines = buf.split(/[\r\n]+/);   // 改行が \n でも \r\n でも \r でも読める
        buf = lines.pop();
        lines.forEach(l => { if (l.trim()) handleSerialLine(dev, l.trim()); });
      }
    } catch (e) {
      // USBケーブルが抜けたときなど
    }
    dev.reader.releaseLock();
    dev.reader = null;
    await closed;
    try { await port.close(); } catch (e) {}
    dev.port = null;
    if (dev.kind === 'ジョイスティック' || label === 'ジョイスティック') {
      JOY_ORDER.forEach(release);   // 倒したまま切れても歩き続けないように
    }
    dev.kind = null;
    dev.setStatus('未接続', false);
  };

  dev.disconnect = async () => {
    if (dev.reader) await dev.reader.cancel();   // 読み取りループが終わり、後片付けされる
  };

  if ('serial' in navigator) {
    btn.addEventListener('click', () => {
      btn.blur();                 // スペースキーでボタンが押されないように
      return dev.port ? dev.disconnect() : dev.connect();
    });
  } else {
    btn.disabled = true;
    dev.setStatus('このブラウザは非対応です（Chrome か Edge で開いてください）', false);
  }
  return dev;
}

const devices = [
  makeSerialDevice('joyBtn', 'joyStatus', 'ジョイスティック'),
  makeSerialDevice('btnBtn', 'btnStatus', 'ボタン'),
];

function tryStartMove() {
  const d = held[held.length - 1];
  if (!d) return false;
  hero.dir = d;                      // 通れなくても向きは変える
  const [dx, dy] = DIRS[d];
  if (isDoor(hero.tx + dx, hero.ty + dy) && !keyDone) { lockedHint(); return false; }
  if (!isWalkable(hero.tx + dx, hero.ty + dy)) return false;   // 敵のいるマスにも入れる（触れるとやられる）
  hero.fromX = hero.tx;
  hero.fromY = hero.ty;
  hero.tx += dx;
  hero.ty += dy;
  hero.moving = true;
  hero.step++;
  return true;
}

function updateHero(dt) {
  if (!hero.moving) {
    tryStartMove();
    return;
  }
  hero.progress += WALK_SPEED * dt;
  if (hero.progress >= 1) {
    const extra = hero.progress - 1;
    hero.progress = 0;
    hero.moving = false;
    if (isDoor(hero.tx, hero.ty)) { floorClear(); return; }   // 開いた扉に入った
    // キーを押し続けていれば、止まらずに次のマスへ進む
    if (tryStartMove()) hero.progress = extra;
  }
}

// マス移動するもの（主人公・敵）の今の位置(px)
function pixelPos(a) {
  const t = a.moving ? a.progress : 1;
  return {
    x: (a.fromX + (a.tx - a.fromX) * t) * TILE,
    y: (a.fromY + (a.ty - a.fromY) * t) * TILE,
  };
}
const heroPixelPos = () => pixelPos(hero);

// ━━━━━━━━━━━━━━━━ 効果音（Web Audio で合成） ━━━━━━━━━━━━━━━━
let audio = null;
function tone(freq, endFreq, dur, type = 'square', vol = 0.08, delay = 0) {
  try {
    audio = audio || new AudioContext();
    const t0 = audio.currentTime + delay;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(audio.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  } catch (e) { /* 音が出せない環境では鳴らさない */ }
}
const SE = {

  // レベルアップの曲（約1.2秒）：ド ミ ソ ド↑ ／ ソ ド↑ ／ ミ↑―― ＋ 下で和音
  levelUp: () => {

function bgmNote(type, freq, t, dur, vol) {

  g.gain.setValueAtTime(vol, t + dur * 0.7);

    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

  hp.type = 'highpass';
  hp.frequency.value = 7000;

  g.gain.setValueAtTime(kick ? 0.05 : 0.03, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);

// 少し先（0.2秒ぶん）までの音を予約しておく（タイマーが遅れても音がずれない）
function bgmSchedule() {
  // ボスが出ている間はボスのテーマ。曲が変わったら頭から
  const want = boss ? 'boss' : 'normal';
  if (bgm.track !== want) { bgm.track = want; bgm.step = 0; }
  const tr = BGM_TRACKS[bgm.track];
  const stepDur = 60 / tr.tempo / 2;
  while (bgm.nextTime < audio.currentTime + 0.2) {
    const s = bgm.step, t = bgm.nextTime;
    // 階クリアのファンファーレ中はBGMを休む
    if (mode === 'play') {
      const m = tr.melodyAt[s];
      if (m) bgmNote('square', midiHz(m[0]), t, m[1] * stepDur, 0.045);
      const bar = Math.floor(s / 8), inBar = s % 8;
      let root = tr.roots[bar];
      if (Array.isArray(root)) root = root[inBar < 4 ? 0 : 1];
      // ボスのテーマは ベースが オクターブで はねて、バスドラムも多い（せまってくる感じ）
      const bassNote = tr.boss ? (inBar % 2 ? root + 12 : root) : (inBar % 2 ? root + 7 : root);
      bgmNote(tr.boss ? 'sawtooth' : 'triangle', midiHz(bassNote), t, stepDur, tr.boss ? 0.05 : 0.11);
      bgmDrum(t, tr.boss ? inBar % 2 === 0 : inBar % 4 === 0);
    }
    bgm.step = (s + 1) % BGM_STEPS;
    bgm.nextTime += stepDur;
  }
}

    if (audio.state === 'suspended') audio.resume();
    if (!bgm.gain) {
      bgm.gain = audio.createGain();
      bgm.gain.connect(audio.destination);
      const len = Math.floor(audio.sampleRate * 0.05);
      bgm.noise = audio.createBuffer(1, len, audio.sampleRate);
      const d = bgm.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    bgm.gain.gain.setValueAtTime(BGM_VOLUME, audio.currentTime);
    bgm.step = 0;
    bgm.nextTime = audio.currentTime + 0.1;
    bgm.timer = setInterval(bgmSchedule, 50);

// 数字の分だけ玉を当てると倒せる（1は1発、2は2発）。倒すと数字の分だけ経験値
const ENEMY_SPEED = 1.4;        // 1秒に進むマス数（もとは 2）
const RESPAWN_TIME = 5;         // 倒してから次が出てくるまでの秒数
const enemies = [];

function enemyAt(x, y, except = null) {
  return enemies.find(e => e !== except &&
    ((e.tx === x && e.ty === y) || (e.moving && e.fromX === x && e.fromY === y)));
}
const heroOn = (x, y) => (hero.tx === x && hero.ty === y) || (hero.moving && hero.fromX === x && hero.fromY === y);
// 敵どうしは重ならないが、主人公のいるマスには入ってくる（触れるとやられる）
const canEnemyEnter = (x, y, self) => isWalkable(x, y) && !isDoor(x, y) && !enemyAt(x, y, self) && !bossOn(x, y);

function spawnEnemy(n, x, y) {
  // 場所の指定が無い・ふさがっている場合は、主人公から離れた空きマスを探す
  // （スタートから歩いて行けるマスだけから選ぶ。行けない場所にいると倒せないため）
  if (x === undefined || !canEnemyEnter(x, y, null) || heroOn(x, y)) {
    const ok = ([cx, cy]) => canEnemyEnter(cx, cy, null) && !heroOn(cx, cy);
    let cands = reachable.filter(c => ok(c) && Math.abs(c[0] - hero.tx) + Math.abs(c[1] - hero.ty) > CHASE_RANGE);
    if (!cands.length) cands = reachable.filter(ok);   // 狭くて離れた場所が無いとき
    if (!cands.length) return;
    [x, y] = cands[Math.floor(Math.random() * cands.length)];
  }
  enemies.push({
    n, hp: n, tx: x, ty: y, fromX: x, fromY: y, progress: 0, moving: false,
    wait: 0.5 + Math.random() * 1.5, flash: 0, bob: Math.random() * 10, combo: 0,
    chasing: false, alert: 0,
  });
}

const CHASE_RANGE = 5;          // 主人公がこのマス数以内に来ると追いかけてくる（玉の届く距離と同じ）
const CHASE_SPEED = 1.75;       // 追いかけるときの速さ（1秒に進むマス数・もとは 2.5）
const CHASE_PAUSE = 0.15;       // 追いかけるときの、1マスごとの間(秒)

function updateEnemies(dt) {
  for (const e of enemies) {
    e.bob += dt;
    if (e.flash > 0) e.flash -= dt;
    // 続けて当てないと元にもどる
    if (e.hp < e.n) {
      e.combo -= dt;
      if (e.combo <= 0) {
        e.hp = e.n;
        const ep = pixelPos(e);
        effects.push(floatText(ep.x + 8, ep.y - 10, 'もどった!', '#a8ffb0'));
        SE.heal();
      }
    }
    // 主人公が CHASE_RANGE マス以内に入ったら気づいて追いかける（むてき中は追わない）
    const near = invincible <= 0 &&
      Math.abs(e.tx - hero.tx) + Math.abs(e.ty - hero.ty) <= CHASE_RANGE;
    if (near && !e.chasing) {
      e.alert = 0.6;                                  // 頭の上に「!」を出す
      e.wait = Math.min(e.wait, 0.3);                 // 気づいたら、すぐ動き出す
    }
    e.chasing = near;
    if (e.alert > 0) e.alert -= dt;
    if (e.moving) {
      e.progress += (e.chasing ? CHASE_SPEED : ENEMY_SPEED) * dt;
      if (e.progress >= 1) { e.progress = 0; e.moving = false; }
      continue;
    }
    e.wait -= dt;
    if (e.wait > 0) continue;
    let step = null;
    if (e.chasing) {
      // 主人公に近づく方向へ1マス（遠い方の向きを先に試し、ふさがっていればもう一方）
      e.wait = CHASE_PAUSE;
      const ddx = Math.sign(hero.tx - e.tx), ddy = Math.sign(hero.ty - e.ty);
      const tries = Math.abs(hero.tx - e.tx) >= Math.abs(hero.ty - e.ty)
        ? [[ddx, 0], [0, ddy]] : [[0, ddy], [ddx, 0]];
      step = tries.find(([dx, dy]) => (dx || dy) && canEnemyEnter(e.tx + dx, e.ty + dy, e));
    } else {
      // ときどき上下左右のどれかに1マス歩く（4回に1回はその場で休む）
      e.wait = 0.8 + Math.random() * 1.4;
      if (Math.random() < 0.25) continue;
      step = Object.values(DIRS)[Math.floor(Math.random() * 4)];
      if (!canEnemyEnter(e.tx + step[0], e.ty + step[1], e)) step = null;
    }
    if (step) {
      e.fromX = e.tx; e.fromY = e.ty;
      e.tx += step[0]; e.ty += step[1];
      e.moving = true;
    }
  }
  for (let i = respawns.length - 1; i >= 0; i--) {
    respawns[i].t -= dt;
    if (respawns[i].t <= 0) spawnEnemy(respawns.splice(i, 1)[0].n);
  }
  ensureNeeded();
}

function spawnBoss() {
  // 主人公から少しはなれた、歩いて行ける場所に置く（カードが そろったときに あらわれる）
  const ok = ([x, y]) => !isDoor(x, y) && !enemyAt(x, y) && !heroOn(x, y);
  const dist = ([x, y]) => Math.abs(x - hero.tx) + Math.abs(y - hero.ty);

function updateBoss(dt) {
  if (!boss) return;
  boss.bob += dt;
  if (boss.flash > 0) boss.flash -= dt;
  if (boss.stun > 0) { boss.stun -= dt; return; }          // 玉が当たって止まっている
  if (boss.moving) {
    boss.progress += BOSS_SPEED * dt;
    if (boss.progress >= 1) { boss.progress = 0; boss.moving = false; }
    return;
  }
  boss.wait -= dt;
  if (boss.wait > 0) return;
  let step = null;
  const near = invincible <= 0 && Math.abs(boss.tx - hero.tx) + Math.abs(boss.ty - hero.ty) <= BOSS_CHASE_RANGE;
  const ok = ([dx, dy]) => (dx || dy) && canEnemyEnter(boss.tx + dx, boss.ty + dy, null);
  if (near) {
    boss.wait = 0.3;
    const ddx = Math.sign(hero.tx - boss.tx), ddy = Math.sign(hero.ty - boss.ty);
    const tries = Math.abs(hero.tx - boss.tx) >= Math.abs(hero.ty - boss.ty) ? [[ddx, 0], [0, ddy]] : [[0, ddy], [ddx, 0]];
    step = tries.find(ok);
  } else {
    boss.wait = 1.0 + Math.random();
    const s = Object.values(DIRS)[Math.floor(Math.random() * 4)];
    if (ok(s)) step = s;
  }
  if (step) {
    boss.fromX = boss.tx; boss.fromY = boss.ty;
    boss.tx += step[0]; boss.ty += step[1];
    boss.moving = true;
  }

  if (!boss) return false;
  const bp = pixelPos(boss);
  return b.x >= bp.x - 6 && b.x <= bp.x + 22 && b.y >= bp.y - 14 && b.y <= bp.y + 15;
}
// 玉が当たると たいりょくが 1 へる（回復しない）
function hitBoss() {
  boss.hp--;
  boss.stun = BOSS_STUN;
  boss.flash = 0.12;
  const bp = pixelPos(boss);
  const count = boss.maxHp - boss.hp;                        // 何発目か
  effects.push(countText(bp.x + 8, bp.y - 14, count));
  SE.hit(((count - 1) % 12) + 1);
  if (boss.hp <= 0) defeatBoss();
}

function defeatBoss() {
  const bp = pixelPos(boss);
  const bx = boss.tx, by = boss.ty;
  effects.push(pokan(bp.x + 8, bp.y, 9));
  effects.push(pokan(bp.x, bp.y + 8, 7));
  effects.push(pokan(bp.x + 16, bp.y + 8, 4));
  boss = null;
  bossBeaten = true;
  SE.pokan();
  updateCardPanel(true);
  if (cardsDone()) {
    keyItem = { x: bx, y: by };                               // ボスのいた場所にカギが出る
    effects.push(banner('ボスを たおした!', 'ボスのいた場所に カギが出たよ　とりにいこう', 2.6));
    SE.key();
  } else {
    effects.push(banner('ボスを たおした!', 'あとは カードを あつめよう　のこり ' + (cardTotal() - got.length) + 'まい', 2.6));
  }
  addExp(floor * BOSS_HP_RATE);                               // ボスの分の EXP
}

function drawBoss(ax, ay) {
  const bobY = Math.floor(boss.bob * 2) % 2;
  const spr = BOSS_SPRITE[boss.flash > 0 ? 'flash' : 'normal'];
  const shake = boss.stun > 0 ? (Math.floor(boss.stun * 30) % 2 ? 1 : -1) : 0;
  ctx.drawImage(spr, ax - 8 + shake, ay - 16 - bobY, TILE * 2, TILE * 2);
  // 頭の上に たいりょくの バーと 数
  const w = 36, bx = ax + 8 - w / 2, by = ay - 21 - bobY;
  ctx.fillStyle = '#2b1d2a';
  ctx.fillRect(bx - 1, by - 1, w + 2, 5);
  ctx.fillStyle = '#4a4a5e';
  ctx.fillRect(bx, by, w, 3);
  ctx.fillStyle = '#ff6a5a';
  ctx.fillRect(bx, by, Math.round(w * boss.hp / boss.maxHp), 3);
  outlineText('ボス ' + boss.hp, ax + 8, by - 7, '#ff9a8a', 10);
}

// ━━━━━━━━━━━━━━━━ 階（面）とカギ ━━━━━━━━━━━━━━━━
// 扉の数 ＝ 階の数（1かい＝とびら1、2かい＝とびら2 …）
// 扉の数「ぴったり」の カードを あつめる。カードが ぜんぶ そろうと カギが出る。
//   「？」  ＝ 1ぴきで ぴったり（例: とびら3 で 3 を たおす）
//   「？＋？」＝ 2ひきで ぴったり（たおした じゅん。2+1 と 1+2 は べつの カード）
// CARD_SLOTS: 階ごとの カードの まい数。single＝「？」、pair＝「？＋？」
const CARD_SLOTS = {
  1: { single: 1, pair: 0 },     // ？
  2: { single: 1, pair: 1 },     // ？  ？＋？
  3: { single: 1, pair: 2 },     // ？  ？＋？  ？＋？
  4: { single: 1, pair: 3 },     // ？  ？＋？ ×3
  5: { single: 1, pair: 3 },     // ？  ？＋？ ×3  ＋ ボス
};
const CARD_SLOTS_DEFAULT = { single: 0, pair: 4 };   // 6かい から: ？＋？ ×4
function slotsFor(f) {
  const s = CARD_SLOTS[f] || CARD_SLOTS_DEFAULT;
  const pairs = cardList(f).filter(c => c.includes('+')).length;   // 作れる「？＋？」の数（大きい階は少ない）
  return { single: f <= 9 ? s.single : 0, pair: Math.min(s.pair, pairs) };
}
// target: 扉の数  pool: 出てくる敵の数字（1 〜 階の数。ただし 9 まで）
const FLOOR_SELECT_MAX = 20;    // 「スタートの階」で選べるいちばん上の階
const floorDef = () => ({
  target: [floor],
  pool: Array.from({ length: Math.min(9, floor) }, (_, i) => i + 1),
});
// 1つの階に出る敵の数（マップが広いほど多い）。1階 = 5体、8階 = 11体くらい
const enemyCount = () => 4 + Math.round(MAP_W * MAP_H / 300);
const NEEDED_TIME = 1.5;        // 「あと○」の敵がいないとき、出てくるまでの秒数

let floor = 1;
let target = 0;                 // 扉の数
let pieces = [];                // 作りかけの「？＋？」の1つめ（倒した数字）
let got = [];                   // この階で あつめた カード（'3'、'2+1' など）
let slots = { single: 1, pair: 0 };
let keyDone = false;            // カギを拾ったか（扉が開く）
let keyItem = null;             // かけらがそろって、地面に出ているカギ { x, y }
let door = null;                // { x, y }
let mode = 'play';              // 'play' | 'clear'（扉に入った後）
let clearTimer = 0;
let lockedCool = 0;

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const piecesSum = () => pieces.reduce((a, b) => a + b, 0);
const remain = () => target - piecesSum();
function isDoor(x, y) { return door !== null && door.x === x && door.y === y; }
const gotSingle = () => got.filter(c => !c.includes('+')).length;
const gotPair = () => got.filter(c => c.includes('+')).length;
const cardTotal = () => slots.single + slots.pair;
const cardsDone = () => gotSingle() >= slots.single && gotPair() >= slots.pair;
// n を 1ぴきめに たおしたとき、まだ もっていない カードを 作りはじめられるか
function canStart(n) {
  if (n === target) return gotSingle() < slots.single;
  if (n > target || target - n > 9) return false;
  return gotPair() < slots.pair && !got.includes(n + '+' + (target - n));
}

// 右のらんの カード
function updateCardPanel(pop = false) {
  document.getElementById('cardTarget').textContent = target;
  const el = document.getElementById('cardSlots');
  const singles = got.filter(c => !c.includes('+'));
  const pairs = got.filter(c => c.includes('+'));
  const items = [];
  for (let i = 0; i < slots.single; i++) items.push(singles[i] ? { t: singles[i], cls: 'got' } : { t: '？', cls: '' });
  let building = pieces.length === 1;
  for (let i = 0; i < slots.pair; i++) {
    if (pairs[i]) items.push({ t: pairs[i].replace('+', '＋'), cls: 'got' });
    else if (building) { items.push({ t: pieces[0] + '＋？', cls: 'building' }); building = false; }
    else items.push({ t: '？＋？', cls: '' });
  }
  if (isBossFloor()) items.push(bossBeaten ? { t: '👑 ボス OK!', cls: 'boss got' } : { t: '👑 ボス', cls: 'boss' });
  const lastGot = got.length - 1;
  el.innerHTML = '';
  items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'slot ' + it.cls;
    d.textContent = it.t;
    el.appendChild(d);
  });
  if (pop && lastGot >= 0) {
    // いま とった カードを ぽよんと 動かす
    const c = got[lastGot];
    const idx = c.includes('+') ? slots.single + pairs.indexOf(c) : singles.indexOf(c);
    if (el.children[idx]) el.children[idx].classList.add('pop');
  }
}

// ━━━━━━━━━━━━━━━━ きろく（ブラウザに保存）：続きから・さいこう到達階・ずかん ━━━━━━━━━━━━━━━━
// 同じパソコン・同じブラウザで開けば、次の時間も続きから遊べる
const SAVE_KEY = 'dungeonSave';
const save = { floor: 1, best: 1, exp: 0, cards: {}, others: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
function saveGame() {
  save.floor = floor;
  save.exp = exp;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}

// とびらの数 t のカード一覧（1つの数字だけ ＋ 2つの数字の組み合わせ）。数字は1〜9
// 例: 4 → 4, 3+1, 2+2, 1+3   （3+1 と 1+3 は べつの カード）
function cardList(t) {
  const list = [];
  if (t <= 9) list.push(String(t));
  for (let a = Math.min(9, t - 1); a >= 1 && t - a <= 9; a--) list.push(a + '+' + (t - a));
  return list;
}
// ずかんに出す段（1 〜 さいこう到達階。少なくとも10まで見せて、先があることを見せる）
const zukanRows = () => Math.max(10, save.best);
function zukanCount() {
  let got = 0, all = 0;
  for (let t = 1; t <= zukanRows(); t++) {
    const list = cardList(t);
    all += list.length;
    got += list.filter(c => (save.cards[t] || []).includes(c)).length;
  }
  return { got, all };
}
// とった カードを ずかんに 記録する。はじめての カードなら true
function recordCard(t, c) {
  save.cards[t] = save.cards[t] || [];
  if (save.cards[t].includes(c)) return false;
  save.cards[t].push(c);
  return true;
}
// ━━━ レベル（EXP で上がる） ━━━
// レベル L になるのに いる EXP の合計: Lv2=40, Lv3=100, Lv4=180, Lv5=280 …（少しずつ ふえる）
// LEVEL_RATE を大きくすると レベルが上がりにくくなる（5 で Lv2=20、10 で Lv2=40）
// EXP のもらい方: 敵を倒す＝その数 ／ ずかんに新しいカード＝+10 ／ とびらを制覇（ずかんの1段がそろう）＝+30
const BONUS_NEW_CARD = 10;
const BONUS_COMPLETE = 30;
const LEVEL_RATE = 10;
const expFor = L => LEVEL_RATE * (L - 1) * (L + 2);
function levelOf(e) { let L = 1; while (expFor(L + 1) <= e) L++; return L; }
let level = 1;
function updateLevel(celebrate = true) {
  const L = levelOf(exp);
  const lo = expFor(L), hi = expFor(L + 1);
  document.getElementById('levelNo').textContent = L;
  document.getElementById('lvFill').style.width = Math.round(100 * (exp - lo) / (hi - lo)) + '%';
  document.getElementById('lvNext').textContent = hi - exp;
  if (celebrate && L > level) {
    effects.push(levelUpFx(L));
    SE.levelUp();
    const st = document.getElementById('levelStat');
    st.classList.remove('up'); void st.offsetWidth; st.classList.add('up');
  }
  level = L;
}
// EXP をふやす（表示とレベルも いっしょに 更新）
function addExp(n) {
  exp += n;
  document.getElementById('exp').textContent = exp;
  const hud = document.getElementById('hud');
  hud.classList.remove('up'); void hud.offsetWidth; hud.classList.add('up');
  updateLevel();
  saveGame();
}

function updateSideInfo() {
  const z = zukanCount();
  document.getElementById('zukanCount').textContent = z.got;
  document.getElementById('zukanMax').textContent = z.all;
}

// ずかんの画面
const zukanEl = document.getElementById('zukan');
let zukanOpen = false;
function renderZukan() {
  const list = document.getElementById('zukanList');
  list.innerHTML = '';
  for (let t = 1; t <= zukanRows(); t++) {
    const cards = cardList(t), got = save.cards[t] || [], others = (save.others[t] || []).length;
    const row = document.createElement('div');
    row.className = 'zrow';
    const n = cards.filter(c => got.includes(c)).length;
    const complete = cards.length > 0 && n === cards.length;
    row.innerHTML = `<div class="door">とびら ${t}<small>${n}/${cards.length}</small></div>`;
    for (const c of cards) {
      const el = document.createElement('div');
      const has = got.includes(c);
      el.className = 'zcard' + (has ? ' got' : '') + (has && complete ? ' complete' : '');
      el.textContent = has ? c : c.replace(/\d/g, '？');   // まだのカードは「？+？」
      row.appendChild(el);
    }
    if (others) {
      const o = document.createElement('div');
      o.className = 'zothers';
      o.textContent = 'ほかの作り方 ' + others + 'しゅ';
      row.appendChild(o);
    }
    list.appendChild(row);
  }
  const z = zukanCount();
  document.getElementById('zukanTotal').textContent = `あつめた カード ${z.got} / ${z.all}`;
}
function toggleZukan(open = !zukanOpen) {
  zukanOpen = open;
  if (open) renderZukan();
  zukanEl.classList.toggle('open', open);
  held.length = 0;                 // 開いている間に押したキーで勝手に歩かないように
}
document.getElementById('zukanBtn').addEventListener('click', e => { e.currentTarget.blur(); toggleZukan(); });
document.getElementById('zukanClose').addEventListener('click', e => { e.currentTarget.blur(); toggleZukan(false); });
addEventListener('keydown', e => {
  if (e.key === 'z' || e.key === 'Z') toggleZukan();
  else if (e.key === 'Escape' && zukanOpen) toggleZukan(false);
});

// きろくを消す（先生用。確認してから）
document.getElementById('resetBtn').addEventListener('click', e => {
  e.currentTarget.blur();
  if (!confirm('さいこう到達階・EXP・ずかんの きろくを ぜんぶ けしますか？')) return;
  Object.assign(save, { floor: 1, best: 1, exp: 0, cards: {}, others: {} });
  exp = 0;
  document.getElementById('exp').textContent = exp;
  updateLevel(false);
  floorSel.value = 1;
  startFloor(1);
  updateSideInfo();
});

function startFloor(f) {
  floor = f;
  target = pick(floorDef().target);
  pieces = [];
  got = [];
  slots = slotsFor(f);
  bossBeaten = false;
  keyDone = false;
  keyItem = null;
  mode = 'play';
  door = null;
  generateMap(f);                 // この階のマップを作る（階が上がるほど広い）
  door = chooseDoor();
  Object.assign(hero, { tx: START_X, ty: START_Y, fromX: START_X, fromY: START_Y, progress: 0, moving: false, dir: 'down' });
  invincible = 0;
  enemies.length = 0;
  respawns.length = 0;
  bullets.length = 0;
  effects.length = 0;
  const count = enemyCount();
  for (let i = 0; i < count; i++) spawnEnemy(pick(floorDef().pool));
  boss = null;                    // ボスは カードが そろってから 出てくる
  ensureNeeded(true);
  document.getElementById('floorNo').textContent = floor;
  updateCardPanel();
  saveGame();                     // 今いる階を保存（次は ここから続き）
  const sub = 'とびら ' + target + ' ぴったりの カードを ' + cardTotal() + 'まい あつめよう';
  if (isBossFloor()) {
    effects.push(banner('ボスの かい!  ' + floor + 'かい', sub, 3.2,
      'カードが そろうと ボスが あらわれる!'));
  } else {
    effects.push(banner(floor + 'かい（' + MAP_W + '×' + MAP_H + 'マス）', sub, 2.6));
  }
}

// カードを作るのに いる数字の敵が いなければ出す（いないと先に進めなくなるので）
function ensureNeeded(now = false) {
  if (mode !== 'play' || keyDone || keyItem || cardsDone()) return;
  // 作りかけなら「あと○」の数、そうでなければ カードを作りはじめられる数
  const need = (pieces.length ? [remain()] : floorDef().pool.filter(canStart)).filter(n => n >= 1 && n <= 9);
  if (!need.length) return;
  if (need.some(n => enemies.some(e => e.n === n) || respawns.some(s => s.n === n))) return;
  const n = pick(need);
  if (now) spawnEnemy(n);
  else respawns.push({ n, t: NEEDED_TIME });
}

// 敵を倒したときに、その数字で カードを作る
function collectPiece(n, x, y) {
  if (mode !== 'play' || keyDone || keyItem || cardsDone()) return;
  const bounce = msg => { effects.push(floatText(x, y - 26, msg, '#ff9a8a')); SE.bounce(); };   // 罰はなし
  if (pieces.length === 1) {
    // 「？＋？」の 2ひきめ：のこりの数 ぴったりだけ
    const r = remain();
    if (n !== r) { bounce((n > r ? 'おおきすぎ!' : 'ちいさすぎ!') + '  あと ' + r); return; }
    pieces.push(n);
    getCard(pieces.join('+'), x, y);
    return;
  }
  // 1ぴきめ
  if (n > target) { bounce('おおきすぎ!  とびら ' + target); return; }
  if (!canStart(n)) {
    if (n === target) bounce('「' + n + '」は もう あるよ');
    else if (target - n > 9) bounce('ちいさすぎ!  あと ' + (target - n) + ' は いない');
    else if (gotPair() >= slots.pair) bounce('1ぴきで ' + target + ' ぴったりを さがそう');
    else bounce(n + '+' + (target - n) + ' は もう あるよ');
    return;
  }
  if (n === target) { getCard(String(n), x, y); return; }
  pieces.push(n);
  updateCardPanel();
  effects.push(floatText(x, y - 26, n + ' + ？　あと ' + remain(), '#9ff0ff'));
  SE.piece();
}

// カードを とった
function getCard(c, x, y) {
  got.push(c);
  pieces = [];
  const isNew = recordCard(target, c);
  // ずかんの この段（とびら target）が ぜんぶ そろった ＝ 制覇
  // ただし 1回のクリアで ぜんぶ そろう階（1〜4かい）は、ボーナスなし（はじめに いきなり EXP が ふえないように）
  const needReplay = cardList(target).length > cardTotal();
  const complete = isNew && needReplay && cardList(target).every(k => save.cards[target].includes(k));
  saveGame();
  updateSideInfo();
  updateCardPanel(true);
  effects.push(floatText(x, y - 26, 'カード ' + c + (isNew ? '  NEW! +' + BONUS_NEW_CARD + ' EXP' : ''), '#ffe14a'));
  if (complete) effects.push(floatText(x, y - 40, 'とびら ' + target + ' せいは!  +' + BONUS_COMPLETE + ' EXP', '#7cf08a'));
  SE.piece();
  if (isNew) tone(1568, 2093, 0.25, 'triangle', 0.1, 0.4);   // ずかんに はじめて入った音
  if (!cardsDone()) {
    effects.push(banner('カード ' + c.replace('+', ' + ') + ' = ' + target, 'のこり ' + (cardTotal() - got.length) + 'まい', 1.6));
  } else if (isBossFloor() && !bossBeaten) {
    // ボスの階：カードが そろうと ボスが あらわれる
    spawnBoss();
    boss.wait = 2.5;                // あらわれてすぐは 少し 止まっている
    const bp = pixelPos(boss);
    effects.push(pokan(bp.x + 8, bp.y, 7));
    effects.push(banner('ボスが あらわれた!', 'たいりょく ' + boss.maxHp + '　玉を あてて たおそう（回復しない）', 2.8));
    tone(110, 55, 0.6, 'sawtooth', 0.12);                       // ゴゴゴ…
    tone(220, 110, 0.6, 'square', 0.05, 0.1);
    updateCardPanel();
  } else {
    // カギは、この階で最初に登場した場所（スタート地点）にあらわれる
    keyItem = { x: START_X, y: START_Y };
    effects.push(banner('カードが そろった!', 'さいしょの場所に カギが出たよ　とりにいこう', 2.4));
    SE.key();
  }
  // ボーナス EXP（あとで 足すので、LEVEL UP! が いちばん上に出る）
  const bonus = (isNew ? BONUS_NEW_CARD : 0) + (complete ? BONUS_COMPLETE : 0);
  if (bonus) addExp(bonus);
}

function lockedHint() {
  if (lockedCool > 0) return;
  lockedCool = 1.2;
  const p = heroPixelPos();
  const msg = keyItem ? 'カギを とってきて!' : cardsDone() ? 'ボスを たおそう!' : 'カードを あつめよう  ' + got.length + '/' + cardTotal();
  effects.push(floatText(p.x + 8, p.y - 6, msg, '#ffffff'));
  SE.locked();
}

// 出てきたカギの上に主人公が来たら拾う → 扉が開く
function checkKeyPickup() {
  if (!keyItem) return;
  const p = heroPixelPos();
  if (Math.abs(p.x - keyItem.x * TILE) < 8 && Math.abs(p.y - keyItem.y * TILE) < 8) {
    keyItem = null;
    keyDone = true;
    effects.push(floatText(p.x + 8, p.y - 6, 'カギをとった!', '#ffe14a'));
    effects.push(banner('カギをとった!', 'とびらへ いこう', 2));
    SE.pickup();
  }
}

// 地面に落ちているカギ（ふわふわ上下して、きらっと光る）
function drawKeyItem(camX, camY) {
  if (!keyItem) return;
  const t = performance.now() / 1000;
  const kx = keyItem.x * TILE - camX, ky = keyItem.y * TILE - camY;
  // かげ
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000000';
  ctx.fillRect(kx + 4, ky + 13, 8, 2);
  ctx.globalAlpha = 1;
  drawTile(T.key, kx, ky - 2 - Math.round(Math.sin(t * 4) * 2));
  // きらっ
  if (Math.floor(t * 3) % 3 === 0) {
    const sx = kx + 12, sy = ky - 1;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx, sy - 2, 1, 5);
    ctx.fillRect(sx - 2, sy, 5, 1);
  }
}

function floorClear() {
  mode = 'clear';
  clearTimer = 2.8;
  bullets.length = 0;
  // さいこう到達階を更新して保存（カードは とったときに ずかんへ記録ずみ）
  const newBest = floor + 1 > save.best;
  if (newBest) save.best = floor + 1;
  saveGame();
  updateSideInfo();
  effects.push(banner(floor + 'かい クリア!', got.join('　'), 2.8, newBest ? 'さいこう ' + save.best + 'かい!' : ''));
  SE.clear();
}

function updateFloor(dt) {
  if (lockedCool > 0) lockedCool -= dt;
  if (mode === 'clear') {
    clearTimer -= dt;
    if (clearTimer <= 0) startFloor(floor + 1);
  }
}

// スタートの階を選ぶ（先生が子どもに合わせて選ぶ）
const floorSel = document.getElementById('floorSel');
for (let f = 1; f <= Math.max(FLOOR_SELECT_MAX, save.best); f++) {
  const opt = document.createElement('option');
  opt.value = f;
  opt.textContent = f + 'かい（とびら ' + f + '）' + (f % BOSS_EVERY === 0 ? ' ★ボス' : '');
  floorSel.appendChild(opt);
}
floorSel.addEventListener('change', () => {
  startFloor(Number(floorSel.value));
  floorSel.blur();               // 矢印キーが選択の切り替えに使われないように
});

// ━━━━━━━━━━━━━━━━ 玉 ━━━━━━━━━━━━━━━━
const BULLET_SPEED = 160;       // px/秒（1秒に10マス）
// ボタンを押した回数だけ玉が出る。とても速く押しても玉が重ならないよう、
// 押した分を順番待ちにして、最低 FIRE_GAP 秒あけて1発ずつ出す
const FIRE_GAP = 0.07;
const FIRE_QUEUE_MAX = 9;       // 順番待ちできる最大数
const bullets = [];
let fireCool = 0;
let fireQueue = 0;

function fire() {
  if (mode !== 'play' || zukanOpen) return;
  if (fireQueue < FIRE_QUEUE_MAX) fireQueue++;
}

function shootOne() {
  fireCool = FIRE_GAP;
  const p = heroPixelPos();
  const [dx, dy] = DIRS[hero.dir];
  // dist は主人公の中心から進んだ距離(px)。shotRange マス進んだら消える
  bullets.push({
    x: p.x + 8 + dx * 6, y: p.y + 9 + dy * 6, vx: dx * BULLET_SPEED, vy: dy * BULLET_SPEED,
    dist: 6, maxDist: hero.shotRange * TILE,
  });
  SE.shot();
}

function updateBullets(dt) {
  if (fireCool > 0) fireCool -= dt;
  if (mode !== 'play') fireQueue = 0;
  if (fireQueue > 0 && fireCool <= 0) { fireQueue--; shootOne(); }
  for (const b of bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.dist += BULLET_SPEED * dt;
    // 届く距離を超えたら、ふっと消える
    if (b.dist >= b.maxDist) { b.dead = true; effects.push(spark(b.x, b.y)); continue; }
    const tx = Math.floor(b.x / TILE), ty = Math.floor(b.y / TILE);
    // 木や建物、マップの外に当たったら消える
    if (!isWalkable(tx, ty)) { b.dead = true; effects.push(spark(b.x, b.y)); continue; }
    // ボスに当たったか（ダメージはなく、少し止まる）
    if (bulletHitsBoss(b)) { b.dead = true; effects.push(spark(b.x, b.y)); hitBoss(); continue; }
    // 敵に当たったか（敵の絵の範囲で判定）
    for (const e of enemies) {
      const ep = pixelPos(e);
      if (b.x >= ep.x + 2 && b.x <= ep.x + 14 && b.y >= ep.y + 1 && b.y <= ep.y + 15) {
        b.dead = true;
        hitEnemy(e);
        break;
      }
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].dead) bullets.splice(i, 1);
}

// 敵の数だけ「続けて」当てると倒せる。
// 1発目からタイマーが始まり、次の玉が COMBO_TIME 秒以内に当たらないと元にもどる
const COMBO_TIME = 1.0;

function hitEnemy(e) {
  e.hp--;
  e.flash = 0.12;
  e.combo = COMBO_TIME;
  const ep = pixelPos(e);
  const count = e.n - e.hp;                          // 何発目か（1, 2, 3 …）
  if (e.hp > 0) {
    effects.push(countText(ep.x + 8, ep.y - 2, count));
    SE.hit(count);
    return;
  }
  // ポカン！と消える
  enemies.splice(enemies.indexOf(e), 1);
  effects.push(pokan(ep.x + 8, ep.y + 8, e.n));
  respawns.push({ n: e.n, t: RESPAWN_TIME });
  SE.pokan();
  addExp(e.n);
  collectPiece(e.n, ep.x + 8, ep.y + 8);
}

// ━━━━━━━━━━━━━━━━ エフェクト ━━━━━━━━━━━━━━━━
const effects = [];
function spark(x, y) {        // 玉が壁に当たったときの小さな火花
  return { t: 0, life: 0.15, draw(cx, cy) {
    ctx.fillStyle = '#fff6b0';
    const r = 1 + this.t * 12;
    ctx.fillRect(Math.round(x - cx - r), Math.round(y - cy), 1, 1);
    ctx.fillRect(Math.round(x - cx + r), Math.round(y - cy), 1, 1);
    ctx.fillRect(Math.round(x - cx), Math.round(y - cy - r), 1, 1);
    ctx.fillRect(Math.round(x - cx), Math.round(y - cy + r), 1, 1);
  } };
}
function pokan(x, y, n) {     // 敵が消えるときの「ポカン！」
  const parts = Array.from({ length: 10 }, (_, i) => {
    const a = (i / 10) * Math.PI * 2;
    return { vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 };
  });
  return { t: 0, life: 0.9, draw(cx, cy) {
    const t = this.t;
    // 白いけむりの輪
    if (t < 0.3) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x - cx, y - cy, 3 + t * 40, 0, Math.PI * 2);
      ctx.stroke();
    }
    // 飛び散るかけら
    if (t < 0.4) {
      ctx.fillStyle = ENEMY_COLORS[n].o;
      for (const p of parts) {
        ctx.fillRect(Math.round(x - cx + p.vx * t), Math.round(y - cy + p.vy * t), 2, 2);
      }
    }
    // 文字が浮かび上がる
    ctx.globalAlpha = Math.min(1, (this.life - t) * 3);
    const ty = Math.round(y - cy - 10 - t * 16);
    outlineText('ポカン!', Math.round(x - cx), ty, '#ffffff', 10);
    outlineText('+' + n + ' EXP', Math.round(x - cx), ty + 11, '#ffd84a', 8);
    ctx.globalAlpha = 1;
  } };
}
function pieceFly(x0, y0, x1, y1, n) {   // 倒した数が ボスへ飛んでいく玉
  return { t: 0, life: 0.3, draw(cx, cy) {
    const k = this.t / this.life;
    const x = x0 + (x1 - x0) * k, y = y0 + (y1 - y0) * k - Math.sin(k * Math.PI) * 20;
    ctx.fillStyle = '#2b1d2a';
    ctx.fillRect(Math.round(x - cx) - 4, Math.round(y - cy) - 4, 9, 9);
    ctx.fillStyle = ENEMY_COLORS[n].o;
    ctx.fillRect(Math.round(x - cx) - 3, Math.round(y - cy) - 3, 7, 7);
    outlineText(String(n), Math.round(x - cx), Math.round(y - cy) - 10, '#ffffff', 9);
  } };
}
function outlineText(text, x, y, color, size) {
  ctx.font = `bold ${size}px "Meiryo", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#2b1d2a';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
function floatText(x, y, text, color) {   // ふわっと浮かんで消える文字
  return { t: 0, life: 1.4, draw(cx, cy) {
    ctx.globalAlpha = Math.min(1, (this.life - this.t) * 3);
    outlineText(text, Math.round(x - cx), Math.round(y - cy - this.t * 10), color, 9);
    ctx.globalAlpha = 1;
  } };
}
function countText(x, y, n) {             // 当てた数「1」「2」「3」…
  return { t: 0, life: 0.5, draw(cx, cy) {
    const s = this.t < 0.08 ? 14 : 11;     // 出た瞬間だけ大きく
    ctx.globalAlpha = Math.min(1, (this.life - this.t) * 4);
    outlineText(String(n), Math.round(x - cx + 10), Math.round(y - cy - this.t * 14), '#ffe14a', s);
    ctx.globalAlpha = 1;
  } };
}
function banner(title, sub, life, sub2 = '') {   // 画面のまん中に出る大きな文字（sub2 は3行目・ずかんなど）
  // 前の大きな文字が残っていたら消して、重ならないようにする（LEVEL UP! は のこす）
  for (let i = effects.length - 1; i >= 0; i--) if (effects[i].screen && !effects[i].keep) effects.splice(i, 1);
  return { t: 0, life, screen: true, draw() {
    const a = Math.min(1, this.t * 5, (this.life - this.t) * 3);
    ctx.globalAlpha = a * 0.45;          // 背景の黒をうすく（もとは 0.75）
    ctx.fillStyle = '#1b1b24';
    ctx.fillRect(0, 84, SCREEN_W, sub2 ? 66 : 50);
    ctx.globalAlpha = a;
    outlineText(title, SCREEN_W / 2, 100, '#ffe14a', 16);
    outlineText(sub, SCREEN_W / 2, 121, '#ffffff', 10);
    if (sub2) outlineText(sub2, SCREEN_W / 2, 138, '#7cf08a', 10);
    ctx.globalAlpha = 1;
  } };
}
function levelUpFx(L) {        // 画面の上のほうに出る「LEVEL UP!」（ほかの大きな文字と重ならない位置）
  return { t: 0, life: 2.4, screen: true, keep: true, draw() {
    const a = Math.min(1, this.t * 6, (this.life - this.t) * 3);
    const s = this.t < 0.15 ? 22 : 18;                      // 出た瞬間だけ大きく
    ctx.globalAlpha = a;
    outlineText('LEVEL UP!', SCREEN_W / 2, 62, '#7cf08a', s);
    outlineText('レベル ' + L, SCREEN_W / 2, 76, '#ffffff', 10);
    ctx.globalAlpha = 1;
  } };
}
function updateEffects(dt) {
  for (const f of effects) f.t += dt;
  for (let i = effects.length - 1; i >= 0; i--) if (effects[i].t >= effects[i].life) effects.splice(i, 1);
}

// ━━━━━━━━━━━━━━━━ 敵に触れるとやられる ━━━━━━━━━━━━━━━━
// ぶるぶる → コテンと倒れる → 集めたかけら・持ち玉が 0 になって、スタート地点から再開
const SHAKE_TIME = 0.7;         // ぶるぶるふるえる時間
const FALL_TIME = 0.2;          // 倒れるまでの時間
const DEAD_TIME = 2.4;          // やられてから再開までの時間（合計）
const INVINCIBLE_TIME = 2.0;    // 再開してから敵に触れても平気な時間
const TOUCH_DIST = 11;          // 主人公と敵の距離(px)がこれより近いと「触れた」
let deadT = 0;
let invincible = 0;

function checkTouch() {
  if (invincible > 0 || mode !== 'play') return;   // 扉に入った瞬間などは対象外
  const p = heroPixelPos();
  for (const e of enemies) {
    const ep = pixelPos(e);
    if (Math.abs(ep.x - p.x) < TOUCH_DIST && Math.abs(ep.y - p.y) < TOUCH_DIST) { heroDie(); return; }
  }
  // ボス（体が大きいので、上のほうも当たる）
  if (boss) {
    const bp = pixelPos(boss), dy = p.y - bp.y;
    if (Math.abs(bp.x - p.x) < BOSS_TOUCH && dy > -24 && dy < 12) { heroDie(); return; }
  }
}

function heroDie() {
  mode = 'dead';
  deadT = 0;
  fireQueue = 0;                // 持ち玉（撃つ予定の玉）も、飛んでいる玉も消える
  bullets.length = 0;
  SE.dead();
}

function revive() {
  // 作りかけの「？＋？」だけ なくなる（とった カード・カギは そのまま）
  const lost = pieces.length > 0;
  pieces = [];
  updateCardPanel();
  // 敵の「当てた数」も元にもどす
  for (const e of enemies) { e.hp = e.n; e.combo = 0; }
  // ボスは元の場所にもどる（たいりょくは 回復しない）
  if (boss) {
    Object.assign(boss, { tx: boss.homeX, ty: boss.homeY, fromX: boss.homeX, fromY: boss.homeY,
                          progress: 0, moving: false, wait: 1.5, stun: 0 });
  }
  Object.assign(hero, { tx: START_X, ty: START_Y, fromX: START_X, fromY: START_Y, progress: 0, moving: false, dir: 'down' });
  mode = 'play';
  invincible = INVINCIBLE_TIME;
  effects.push(banner('やられた…', (lost ? '作りかけの カードは なくなった　' : '') + 'とった カードは そのまま', 2));
}

function updateDead(dt) {
  deadT += dt;
  if (deadT >= DEAD_TIME) revive();
}

// やられたときの主人公の絵
function drawDeadHero(ax, ay) {
  const spr = SPRITES.down[0];
  if (deadT < SHAKE_TIME) {
    // ぶるぶる：左右にふるえながら、白く点滅
    const dx = Math.floor(deadT * 30) % 2 ? 1 : -1;
    ctx.drawImage(Math.floor(deadT * 12) % 2 ? HERO_WHITE : spr, ax + dx, ay);
    return;
  }
  // コテン：足元を中心に横に倒れる
  const k = Math.min(1, (deadT - SHAKE_TIME) / FALL_TIME);
  ctx.save();
  ctx.translate(ax + 8, ay + 16);
  ctx.rotate(-Math.PI / 2 * k * k);
  ctx.drawImage(spr, -8, -16);
  ctx.restore();
  if (k >= 1) {
    // 頭のまわりをくるくる回る星
    const t = deadT - SHAKE_TIME - FALL_TIME;
    for (let i = 0; i < 3; i++) {
      const a = t * 5 + i * Math.PI * 2 / 3;
      const sx = Math.round(ax - 6 + Math.cos(a) * 7), sy = Math.round(ay + 8 + Math.sin(a) * 3 - 6);
      ctx.fillStyle = '#2b1d2a';
      ctx.fillRect(sx - 1, sy - 1, 3, 3);
      ctx.fillStyle = '#ffe14a';
      ctx.fillRect(sx, sy, 1, 1);
    }
    if (t < 0.9) outlineText('コテン', ax + 8, ay - 4 - Math.round(t * 6), '#ffffff', 9);
  }
}

function update(dt) {
  if (mode === 'play') {
    if (invincible > 0) invincible -= dt;
    updateHero(dt);
    updateEnemies(dt);
    updateBoss(dt);
    checkKeyPickup();
    checkTouch();
  } else if (mode === 'dead') {
    updateDead(dt);
  }
  updateBullets(dt);
  updateEffects(dt);
  updateFloor(dt);
}

// ━━━━━━━━━━━━━━━━ 描画 ━━━━━━━━━━━━━━━━
const sheet = new Image();
sheet.src = 'tiles.png';

function drawTile(n, px, py) {
  const sx = (n % SHEET_COLS) * TILE;
  const sy = Math.floor(n / SHEET_COLS) * TILE;
  ctx.drawImage(sheet, sx, sy, TILE, TILE, px, py, TILE, TILE);
}

function draw() {
  const p = heroPixelPos();
  // カメラは主人公を中心に、マップの外が映らない範囲で動く
  const camX = Math.round(Math.max(0, Math.min(MAP_W * TILE - SCREEN_W, p.x + TILE / 2 - SCREEN_W / 2)));
  const camY = Math.round(Math.max(0, Math.min(MAP_H * TILE - SCREEN_H, p.y + TILE / 2 - SCREEN_H / 2)));

  const x0 = Math.floor(camX / TILE), y0 = Math.floor(camY / TILE);
  for (let y = y0; y <= y0 + VIEW_H && y < MAP_H; y++) {
    for (let x = x0; x <= x0 + VIEW_W && x < MAP_W; x++) {
      const px = x * TILE - camX, py = y * TILE - camY;
      drawTile(ground[y][x], px, py);
      if (obj[y][x] !== null) drawTile(obj[y][x], px, py);
    }
  }

  drawDoor(camX, camY);
  drawKeyItem(camX, camY);

  // 主人公と敵を、下にいるものほど手前になるよう y の順に描く
  const actors = enemies.map(e => ({ e, pos: pixelPos(e) }));
  if (mode === 'play' || mode === 'dead') actors.push({ hero: true, pos: p });   // 扉に入ったら主人公は消える
  if (boss) actors.push({ boss: true, pos: pixelPos(boss) });
  actors.sort((a, b) => a.pos.y - b.pos.y);
  for (const a of actors) {
    const ax = Math.round(a.pos.x - camX), ay = Math.round(a.pos.y - camY);
    if (a.boss) { drawBoss(ax, ay); continue; }
    if (a.hero) {
      if (mode === 'dead') { drawDeadHero(ax, ay); continue; }
      // 生き返った直後の「むてき」の間は点滅する
      if (invincible > 0 && Math.floor(invincible * 10) % 2) continue;
      // 歩いている間は 1→0→2→0 の順に足を動かす
      let frame = 0;
      if (hero.moving) frame = hero.progress < 0.5 ? (hero.step % 2 ? 1 : 2) : 0;
      ctx.drawImage(SPRITES[hero.dir][frame], ax, ay);
    } else {
      const e = a.e;
      const bobY = Math.floor(e.bob * 3) % 2;           // ぴょこぴょこ上下に動く
      const spr = ENEMY_SPRITES[e.n][e.flash > 0 ? 'flash' : 'normal'];
      ctx.drawImage(spr, ax, ay - bobY);
      // 残りの当たり数を、頭の上に小さな四角で表示
      const top = ay + 15 - ENEMY_SHAPES[e.n].length - bobY;   // 絵の上はし
      // 数の分の四角。当てた分は黄色になる（数えながら当てる）
      const bw = e.n * 3 + 1;
      const bx0 = ax + 8 - Math.round(bw / 2);
      const hits = e.n - e.hp;
      ctx.fillStyle = '#2b1d2a';
      ctx.fillRect(bx0, top - 6, bw, 4);
      for (let i = 0; i < e.n; i++) {
        ctx.fillStyle = i < hits ? '#ffe14a' : '#ffffff';
        ctx.fillRect(bx0 + 1 + i * 3, top - 5, 2, 2);
      }
      // 次の玉までの残り時間（へっていく線）
      if (hits > 0) {
        const w = Math.max(0, Math.round((bw - 2) * e.combo / COMBO_TIME));
        ctx.fillStyle = '#2b1d2a';
        ctx.fillRect(bx0, top - 2, bw, 3);
        ctx.fillStyle = e.combo < 0.35 ? '#ff6a5a' : '#7cf08a';
        ctx.fillRect(bx0 + 1, top - 1, w, 1);
      }
      // 主人公に気づいた瞬間の「!」
      if (e.alert > 0) outlineText('!', ax + 8, top - 13, '#ff5a4a', 12);
    }
  }

  // 玉
  for (const b of bullets) {
    const bx = Math.round(b.x - camX), by = Math.round(b.y - camY);
    ctx.fillStyle = '#2b1d2a';
    ctx.fillRect(bx - 2, by - 2, 5, 5);
    ctx.fillStyle = '#ffe14a';
    ctx.fillRect(bx - 1, by - 1, 3, 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bx - 1, by - 1, 1, 1);
  }

  for (const f of effects) if (!f.screen) f.draw(camX, camY);
  drawDoorArrow(camX, camY);
  drawKeyPanel();
  for (const f of effects) if (f.screen) f.draw();
}

// 扉（カギがないあいだは錠前つき。上に扉の数を出す）
function drawDoor(camX, camY) {
  if (!door) return;
  const dx = door.x * TILE - camX, dy = door.y * TILE - camY;
  drawTile(T.door, dx, dy);
  if (!keyDone) {
    // 錠前
    ctx.fillStyle = '#2b1d2a';
    ctx.fillRect(dx + 4, dy + 6, 8, 8);
    ctx.fillRect(dx + 5, dy + 2, 6, 5);
    ctx.fillStyle = '#e0b040';
    ctx.fillRect(dx + 5, dy + 7, 6, 6);
    ctx.fillStyle = '#2b1d2a';
    ctx.fillRect(dx + 7, dy + 9, 2, 3);
    ctx.fillStyle = '#c8c8d0';
    ctx.fillRect(dx + 6, dy + 3, 4, 1);
    ctx.fillRect(dx + 6, dy + 3, 1, 4);
    ctx.fillRect(dx + 9, dy + 3, 1, 4);
  } else {
    // 開いた扉はきらきら光る
    const t = performance.now() / 1000;
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 6);
    ctx.fillStyle = '#fff6b0';
    ctx.fillRect(dx + 2, dy + 2, 12, 13);
    ctx.globalAlpha = 1;
  }
  // 扉の数の札
  const label = String(target);
  const w = label.length * 6 + 6;
  ctx.fillStyle = '#2b1d2a';
  ctx.fillRect(dx + 8 - w / 2 - 1, dy - 12, w + 2, 11);
  ctx.fillStyle = keyDone ? '#ffe14a' : '#ffffff';
  ctx.fillRect(dx + 8 - w / 2, dy - 11, w, 9);
  ctx.font = 'bold 9px "Meiryo", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2b1d2a';
  ctx.fillText(label, dx + 8, dy - 6);
}

// 次に行く場所（出てきたカギ → 拾ったら扉）が画面の外なら、画面のはしに矢印を出す
function drawDoorArrow(camX, camY) {
  if (mode !== 'play') return;
  const goal = keyItem ? keyItem : keyDone ? door : null;
  if (!goal) return;
  const cx = goal.x * TILE + 8 - camX, cy = goal.y * TILE + 8 - camY;
  if (cx >= 0 && cx < SCREEN_W && cy >= 0 && cy < SCREEN_H) return;
  const W = SCREEN_W, H = SCREEN_H;
  const ang = Math.atan2(cy - H / 2, cx - W / 2);
  const ax = Math.max(12, Math.min(W - 12, cx)), ay = Math.max(56, Math.min(H - 12, cy));
  const pulse = 1 + 0.2 * Math.sin(performance.now() / 120);
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(ang);
  ctx.scale(pulse, pulse);
  ctx.beginPath();
  ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath();
  ctx.fillStyle = '#ffe14a';
  ctx.strokeStyle = '#2b1d2a';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fill();
  ctx.restore();
}

// 左上のカギパネル：扉の数・10のまとまりの枠・集めたかけら・あといくつ
function drawKeyPanel() {
  const frames = Math.max(1, Math.ceil(target / 10));
  const CELL = 7;
  const frameW = 5 * CELL + 1;
  const sum = piecesSum();
  const eq = pieces.length ? pieces[0] + '+？' : '';
  ctx.font = 'bold 9px "Meiryo", sans-serif';
  const eqRight = 9 + frames * (frameW + 4) + ctx.measureText(eq).width + 6;
  const W = Math.ceil(Math.max(eqRight, keyDone || keyItem || cardsDone() ? 168 : 130));
  ctx.globalAlpha = 0.55;          // 背景の黒をうすく（もとは 0.85）
  ctx.fillStyle = '#1b1b24';
  ctx.fillRect(3, 3, W, 46);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = keyDone || keyItem ? '#ffe14a' : '#6a6a80';
  ctx.lineWidth = 1;
  ctx.strokeRect(3.5, 3.5, W - 1, 45);

  // カギのアイコン（拾うまでは暗い。出ている間は点滅）
  if (!keyDone) ctx.globalAlpha = keyItem && Math.floor(performance.now() / 300) % 2 ? 0.9 : 0.35;
  drawTile(T.key, 6, 5);
  ctx.globalAlpha = 1;
  ctx.font = 'bold 10px "Meiryo", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#2b1d2a';
  const say = (text, x, y, color) => { ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y); };
  say('とびら ' + target, 24, 13, '#ffffff');
  if (keyDone) say('カギ完成! とびらへ', 70, 13, '#ffe14a');
  else if (keyItem) say('カギをとりにいこう', 70, 13, '#ffe14a');
  else if (cardsDone()) say('ボスを たおそう', 70, 13, '#ff9a8a');
  else if (pieces.length) say('あと ' + remain(), 76, 13, '#9ff0ff');
  else say('カード ' + got.length + '/' + cardTotal(), 76, 13, '#9ff0ff');

  // 10のまとまりの枠（5×2）。かけらは倒した敵の色で塗る
  const colors = [];
  pieces.forEach(n => { for (let i = 0; i < n; i++) colors.push(ENEMY_COLORS[n].o); });
  for (let f = 0; f < frames; f++) {
    const fx = 7 + f * (frameW + 4), fy = 26;
    ctx.fillStyle = '#2b1d2a';
    ctx.fillRect(fx, fy, frameW, 2 * CELL + 1);
    for (let i = 0; i < 10; i++) {
      const idx = f * 10 + i;
      const cx = fx + 1 + (i % 5) * CELL, cy = fy + 1 + Math.floor(i / 5) * CELL;
      if (idx >= target) { ctx.fillStyle = '#2b1d2a'; }            // 扉の数より先は使わない
      else ctx.fillStyle = idx < colors.length ? colors[idx] : '#4a4a5e';
      ctx.fillRect(cx, cy, CELL - 1, CELL - 1);
      if (idx < colors.length) {                                   // ●っぽく見せるハイライト
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(cx + 1, cy + 1, 2, 1);
      }
    }
  }
  if (eq) {
    ctx.font = 'bold 9px "Meiryo", sans-serif';
    say(eq, 9 + frames * (frameW + 4), 33, '#ffffff');
  }
}

// ━━━━━━━━━━━━━━━━ 画面サイズ（整数倍で拡大してドットをきれいに） ━━━━━━━━━━━━━━━━
function resize() {
  // 上下いっぱいまで拡大し、横に あまりが あれば ゲーム画面を横に広げる（映るマスが ふえる）
  // それでも あまった分は、左右の列が広がって うめる
  const sideW = SIDE_MIN * 2 + 8 * 2 + 8 + 4;   // 左右の列 + すき間 + body の余白 + 枠
  const availW = innerWidth - sideW, availH = innerHeight - 8 - 4;
  let scale = availH / SCREEN_H;
  let w = Math.min(VIEW_W_MAX * TILE, availW / scale);   // 横は いちばん広くて VIEW_W_MAX マス
  if (w < VIEW_W_MIN * TILE) { w = VIEW_W_MIN * TILE; scale = availW / w; }   // 横長でない画面
  scale = Math.max(1, scale);
  SCREEN_W = Math.floor(w);
  VIEW_W = Math.ceil(SCREEN_W / TILE);
  const cssW = Math.floor(SCREEN_W * scale), cssH = Math.floor(SCREEN_H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  // キャンバスの中身を画面の実際の画素数で作る（文字がくっきりする）
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  // 描くときは 320×224 の座標のまま使えるように拡大しておく
  ctx.setTransform(canvas.width / SCREEN_W, 0, 0, canvas.height / SCREEN_H, 0, 0);
  ctx.imageSmoothingEnabled = false;   // 大きさを変えると元に戻るので毎回設定
}
addEventListener('resize', resize);
resize();

// ━━━━━━━━━━━━━━━━ メインループ ━━━━━━━━━━━━━━━━
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!zukanOpen) update(dt);      // ずかんを見ている間はゲームを止める
  draw();
  requestAnimationFrame(loop);
}
// 前回の続きから始める（はじめての時は1かい）
exp = save.exp || 0;
document.getElementById('exp').textContent = exp;
updateLevel(false);
floorSel.value = Math.min(save.floor, floorSel.options.length);
startFloor(save.floor || 1);
updateSideInfo();
sheet.onload = () => requestAnimationFrame(loop);
</script>
